{
	Target: "jolt_physics"
	Type: library
	Version: 1.0

	ExecuteHeaderTool: true

	LibOut: "${PATH}/bin/${PLATFORM}/${CONFIG}"
	BuildOut: "${PATH}/bin/${PLATFORM}"

	Include [
		"${ENGINE_PATH}/build/include/Engine",
		"${ENGINE_PATH}/build/include/Util",
		"${PATH}/dep/JoltPhysics"
	]

	LinkTargets [
		"${ENGINE_PATH}/build/${PLATFORM}/Engine-${CONFIG}/Engine.lib",
		"${ENGINE_PATH}/build/${PLATFORM}/Util-${CONFIG}/Util.lib",
		"Jolt"
	]

	// CMake dependencies
	Dependencies [
		"${PATH}/dep/JoltPhysics/Build"
	]
}
